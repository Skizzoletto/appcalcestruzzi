name: Crea APK Android

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Imposta Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Imposta Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Crea struttura Android
        run: flutter create --platforms android .

      - name: Imposta compileSdk Android 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "ERRORE: file Gradle Android non trovato"
            exit 1
          fi

      - name: Scarica librerie
        run: flutter pub get

      - name: Costruisci APK
        run: flutter build apk --release

      - name: Carica file APK finale
        uses: actions/upload-artifact@v4
        with:
          name: app-calcestruzzi-apk
          path: build/app/outputs/flutter-apk/app-release.apk

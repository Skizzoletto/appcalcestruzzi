name: Crea APK Android

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Imposta Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Imposta Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Crea struttura Android
        run: flutter create --platforms android .

      - name: Imposta Android SDK 36
        run: |
          echo "Contenuto build.gradle.kts:"
          cat android/app/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle.kts")
          text = file.read_text()

          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36"
          )

          file.write_text(text)
          PY

          echo "Verifica compileSdk:"
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Scarica librerie
        run: flutter pub get

      - name: Costruisci APK
        run: flutter build apk --release

      - name: Carica file APK finale
        uses: actions/upload-artifact@v4
        with:
          name: app-calcestruzzi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
